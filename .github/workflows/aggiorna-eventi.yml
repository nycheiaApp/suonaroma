# Aggiorna gli eventi di SuonaRoma ogni giorno alle 14:00 (ora italiana).
# Il controllo avviene ogni ora e il job prosegue solo quando a Roma
# sono le 14:00 — così l'ora esatta resta corretta anche al cambio
# ora legale/solare (il cron di GitHub è in UTC).
#
# Avvio manuale possibile dalla scheda Actions → "Aggiorna eventi" → Run workflow.

name: Aggiorna eventi

on:
  schedule:
    - cron: '0 * * * *'          # ogni ora; il guard orario decide se eseguire
  workflow_dispatch: {}          # avvio manuale

permissions:
  contents: write                # serve per il commit dei dati aggiornati

concurrency:
  group: aggiorna-eventi
  cancel-in-progress: false

jobs:
  aggiorna:
    # ubuntu-24.04 fissato esplicitamente: il tag ubuntu-latest sta migrando
    # a Ubuntu 26 (avviso di GitHub, ott. 2026) e così l'ambiente resta stabile.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v7   # v4 usa Node.js 20, in dismissione dai runner

      - name: Setup Python
        uses: actions/setup-python@v7   # idem: v5 usava Node.js 20
        with:
          python-version: '3.12'

      - name: È l'ora (14:00 a Roma)?
        id: orario
        run: |
          H=$(TZ=Europe/Rome date +%H)
          echo "Ora italiana corrente: $H"
          echo "esegui=$([[ "$H" == "14" ]] && echo sì || echo no)" >> "$GITHUB_OUTPUT"

      # L'estrazione parte alle 14:00 (ora di Roma) nei run programmati;
      # nei run manuali (workflow_dispatch) parte sempre, per i test.
      - name: Estrazione eventi dai siti dei locali
        if: steps.orario.outputs.esegui == 'sì' || github.event_name == 'workflow_dispatch'
        run: python3 tools/aggiorna_eventi.py

      - name: Riepilogo nell'esecuzione
        if: steps.orario.outputs.esegui == 'sì' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -f tools/report.md ]; then
            cat tools/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit e push (solo se i dati sono cambiati)
        if: steps.orario.outputs.esegui == 'sì' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "suonaroma-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/eventi.json data/eventi.js tools/report.json tools/report.md
          if git diff --cached --quiet; then
            echo "Nessuna variazione: niente da committare."
          else
            git commit -m "Aggiornamento automatico eventi $(TZ=Europe/Rome date +'%d/%m/%Y')"
            git push
          fi
